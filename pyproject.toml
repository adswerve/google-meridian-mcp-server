[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-meridian-mcp-server"
version = "0.3.1"
description = "FastMCP server exposing Google Meridian MMM analysis to agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp>=4,<5",
    "google-meridian[schema]==1.7.0",
    "google-cloud-storage>=3.12,<4",
    "google-cloud-run>=0.16.1,<1",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.15.20,<1",
]
jax = [
    "jax>=0.10.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: exercises a real fitted Meridian model (slow; builds fixtures)"]

[tool.ruff]
target-version = "py313"
line-length = 88
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
extend-exclude = [
    "references",
    "src/google_meridian_mcp_server.egg-info",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"meridian".msg = "worker-only; server uses the subprocess runner"
"tensorflow".msg = "worker-only"
"tensorflow_probability".msg = "worker-only"
"jax".msg = "worker-only"
"google_meridian_mcp_server.meridian".msg = "worker-only; do not import from the server"

[tool.ruff.lint.per-file-ignores]
"src/google_meridian_mcp_server/meridian/*" = ["TID251"]
"src/google_meridian_mcp_server/execution/worker.py" = ["TID251"]
"src/google_meridian_mcp_server/execution/analysis_ops.py" = ["TID251"]
"tests/*" = ["TID251"]
"scripts/*" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
