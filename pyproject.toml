[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-meridian-mcp-server"
version = "0.3.1"
description = "FastMCP server exposing Google Meridian MMM analysis to agents"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=3.4.3,<4",
    "google-meridian[schema]==1.7.0",
    "google-cloud-storage>=3.12,<4",
    "google-cloud-run>=0.16.1,<1",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.15.20,<1",
]
jax = [
    "jax>=0.10.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: exercises a real fitted Meridian model (slow; builds fixtures)"]

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
extend-exclude = [
    "references",
    "src/google_meridian_mcp_server.egg-info",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
